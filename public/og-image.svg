<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100e"/>
      <stop offset="0.5" stop-color="#0a1512"/>
      <stop offset="1" stop-color="#14231f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d98a"/>
      <stop offset="1" stop-color="#18aa68"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d98a"/>
      <stop offset="1" stop-color="#0f905b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#18aa68" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#18aa68" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Emerald brand accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>

  <!-- Decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Eyebrow / category tag -->
  <g transform="translate(90, 130)">
    <rect width="280" height="38" rx="19" fill="#18aa68" fill-opacity="0.12" stroke="#18aa68" stroke-opacity="0.25"/>
    <text x="140" y="25" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700"
          fill="#39d98a" text-anchor="middle" letter-spacing="2">SMART FOOTBALL PICKS</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(90, 220)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="76" font-weight="800" fill="#eaeaf0" letter-spacing="-2">
      <tspan x="0" dy="0">Today's smart picks.</tspan>
      <tspan x="0" dy="90" fill="url(#brand)">Real odds.</tspan>
    </text>
  </g>

  <!-- Subhead -->
  <text x="90" y="460" font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="26" font-weight="500" fill="#eaeaf0" fill-opacity="0.6">
    Banker · 2 Odds · 5 Odds · 10 Odds · Over Goals · 3-day Rollover
  </text>

  <!-- Bottom row with brand + stats -->
  <g transform="translate(90, 530)">
    <!-- Option B wordmark: crisp type, correct contrasting BET + emerald SIGHTLY -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif"
          font-size="38" font-weight="900" fill="#f4fcf7" letter-spacing="-2">BET</text>
    <text x="82" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif"
          font-size="38" font-weight="900" fill="#25e69b" letter-spacing="-2">SIGHTLY</text>

    <!-- Right side stats -->
    <g transform="translate(700, 0)">
      <text font-family="'JetBrains Mono', monospace" font-size="14" fill="#eaeaf0" fill-opacity="0.5">
        <tspan x="0" y="0">VERIFIED BOOKING CODES</tspan>
        <tspan x="200" y="0">·</tspan>
        <tspan x="220" y="0">RESULTS TRACKED</tspan>
      </text>
    </g>
  </g>
</svg>

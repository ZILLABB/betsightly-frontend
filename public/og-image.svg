<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07071a"/>
      <stop offset="0.5" stop-color="#0c0c22"/>
      <stop offset="1" stop-color="#181840"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top gold accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>

  <!-- Decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Eyebrow / category tag -->
  <g transform="translate(90, 130)">
    <rect width="280" height="38" rx="19" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.25"/>
    <text x="140" y="25" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700"
          fill="#60a5fa" text-anchor="middle" letter-spacing="2">SMART FOOTBALL PICKS</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(90, 220)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="76" font-weight="800" fill="#f1f1ff" letter-spacing="-2">
      <tspan x="0" dy="0">Daily safe picks.</tspan>
      <tspan x="0" dy="90" fill="url(#brand)">Real odds.</tspan>
    </text>
  </g>

  <!-- Subhead -->
  <text x="90" y="460" font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="26" font-weight="500" fill="#f1f1ff" fill-opacity="0.6">
    2 Odds · 5 Odds · 10 Odds · Over 1.5 · 10-day Rollover · World Cup 2026
  </text>

  <!-- Bottom row with brand + stats -->
  <g transform="translate(90, 530)">
    <!-- BetSightly logotype -->
    <text font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif"
          font-size="36" font-weight="800" fill="#f1f1ff">BetSightly</text>

    <!-- Right side stats -->
    <g transform="translate(700, 0)">
      <text font-family="'JetBrains Mono', monospace" font-size="14" fill="#f1f1ff" fill-opacity="0.5">
        <tspan x="0" y="0">REAL BOOKMAKER ODDS</tspan>
        <tspan x="200" y="0">·</tspan>
        <tspan x="220" y="0">FREE FOREVER</tspan>
      </text>
    </g>
  </g>
</svg>

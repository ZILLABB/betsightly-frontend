<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | BetSightly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f17; color: #e0e0e0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .container { max-width: 400px; }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 24px;
      border-radius: 20px; background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 36px; height: 36px; color: #3b82f6; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 24px; }
    button {
      padding: 12px 28px; border-radius: 10px; border: none;
      background: #3b82f6; color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity 200ms;
    }
    button:hover { opacity: 0.85; }
    .brand { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M8.464 15.536a5 5 0 010-7.072M15.536 8.464a5 5 0 010 7.072" />
        <line x1="4" y1="4" x2="20" y2="20" stroke-linecap="round" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      <span class="brand">BetSightly</span> needs an internet connection to fetch the latest predictions.
      Check your connection and try again.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>

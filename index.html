<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary -->
  <title>BetSightly · Smart Football Predictions & Daily Tips</title>
  <meta name="description" content="Football predictions, SportyBet-verified booking codes, daily picks, 2 Odds, 5 Odds, 10 Odds, Over Goals, a three-day Rollover and transparent settled results." />
  <meta name="keywords" content="football predictions, daily predictions, rollover, over goals, SportyBet booking codes, accumulator, settled results" />
  <meta name="author" content="BetSightly" />
  <meta name="theme-color" content="#0B2238" />
  <!-- Set the saved palette and dark/light preference before the first paint.
       Without this, iPhone status-bar and page background briefly flash the
       retired emerald theme while React and preferences load. -->
  <script>
    (function () {
      var root = document.documentElement;
      var choice = new URLSearchParams(window.location.search).get('palette');
      var savedPalette = null;
      try { savedPalette = sessionStorage.getItem('betsightly-preview-palette'); } catch (_) {}
      var palette = choice === 'atlantic' || choice === 'cobalt'
        ? choice : savedPalette === 'cobalt' ? 'cobalt' : 'atlantic';
      root.setAttribute('data-bs-palette', palette);
      try { sessionStorage.setItem('betsightly-preview-palette', palette); } catch (_) {}
      var selectedTheme = 'dark';
      try {
        var savedPreferences = JSON.parse(localStorage.getItem('betsightly_preferences') || '{}');
        if (savedPreferences.theme === 'dark' || savedPreferences.theme === 'light')
          selectedTheme = savedPreferences.theme;
      } catch (_) {}
      var light = selectedTheme === 'light' || (selectedTheme === 'system' &&
        window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.add(light ? 'light' : 'dark');
      var colors = palette === 'cobalt'
        ? { dark: '#111933', light: '#F2F5FD' }
        : { dark: '#0B2238', light: '#F3F7FA' };
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', light ? colors.light : colors.dark);
    })();
  </script>

  <!-- Consistent geometric B identity across the browser and installed-app surfaces. -->
  <link rel="icon" type="image/svg+xml" href="/brand-icon.svg?v=5" />
  <!-- Apple needs a raster icon, using the approved geometric B logo. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png?v=5" />
  <link rel="manifest" href="/manifest.webmanifest?v=5" />

  <!-- Open Graph (WhatsApp, Telegram, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BetSightly" />
  <meta property="og:title" content="BetSightly · Smart Football Predictions" />
  <meta property="og:description" content="Football predictions · Verified bookmaker codes · Three-day rollover · Transparent results" />
  <meta property="og:url" content="https://betsightly.com/" />
  <meta property="og:image" content="https://betsightly.com/og-image.svg" />
  <meta property="og:image:type" content="image/svg+xml" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="BetSightly football predictions with bookmaker prices and transparent results" />
  <meta property="og:locale" content="en_GB" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BetSightly · Smart Football Predictions" />
  <meta name="twitter:description" content="Daily football predictions · Verified booking codes · Three-day rollover" />
  <meta name="twitter:image" content="https://betsightly.com/og-image.svg" />

  <!-- SEO -->
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://betsightly.com/" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
